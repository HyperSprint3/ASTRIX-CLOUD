
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRIX CLOUD | Owner Setup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090611;
            color: white;
            padding: 20px;
        }

        .setup-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border: 1px solid #7035a8;
            border-radius: 15px;
            background: #130d20;
            box-shadow: 0 0 35px #7c3aed22;
        }

        h1 {
            text-align: center;
            color: #bd75ff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #090611;
            color: white;
            border: 1px solid #49315e;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #bd75ff;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(90deg, #8738db, #bd75ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .note {
            color: #999;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <main class="setup-card">
        <h1>ASTRIX CLOUD</h1>
        <p class="subtitle">Create your Owner Account</p>

        <form id="setupForm">
            <label for="username">Username</label>
            <input id="username" name="username"
                   minlength="3" maxlength="30"
                   pattern="[A-Za-z0-9_]+"
                   placeholder="Your username" required>

            <label for="email">Email Address</label>
            <input id="email" name="email"
                   type="email" placeholder="Your email"
                   required>

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" minlength="12"
                   maxlength="128"
                   placeholder="At least 12 characters"
                   required>

            <button id="submitButton" type="submit">
                CREATE OWNER ACCOUNT
            </button>
        </form>

        <p id="message" role="status"></p>
        <p class="note">
            Owner setup works only once, while the users database is empty.
        </p>
    </main>

    <script>
        const form = document.getElementById("setupForm");
        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            message.style.color = "#bd75ff";
            message.textContent = "Creating your Owner account...";

            const username = form.username.value.trim();
            const email = form.email.value.trim();
            const password = form.password.value;

            try {
                const response = await fetch("/api/setup-owner", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || result.message ||
                        "Owner account setup failed.");
                }

                message.style.color = "#22c55e";
                message.textContent =
                    "Owner account created successfully! You can now log in.";

                form.reset();
            } catch (error) {
                message.style.color = "#ef4444";
                message.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
